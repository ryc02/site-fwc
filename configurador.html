<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurador 3D de Varões | F.W.C Soluções</title>

    <meta property="og:title" content="Monte seu Varão 3D | F.W.C Soluções">
    <meta property="og:description" content="Descubra a medida ideal e visualize o seu varão em 3D antes de comprar.">
    <meta property="og:image" content="https://fwcsolucoes.vercel.app/og-image.png">

    <!-- Fontes e Estilos Principais -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=1.3">
    
    <!-- Ícones e Favicon -->
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>

    <style>
        /* Estilos específicos do configurador que não afetam a home */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #f5f7fa;
        }

        .configurator-layout {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        .canvas-container {
            flex: 1;
            position: relative;
            background: linear-gradient(135deg, #ffffff 0%, #f0f2f5 100%);
        }

        #webgl-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .view-controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            pointer-events: none;
        }

        .view-controls span {
            font-size: 0.85rem;
            color: var(--color-text-secondary);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .config-panel {
            width: 450px;
            background: #ffffff;
            box-shadow: -5px 0 25px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            height: 100%;
            z-index: 10;
            overflow-y: auto;
        }

        .config-header {
            padding: 30px;
            border-bottom: 1px solid #eaeaea;
        }

        .config-header h1 {
            font-size: 1.5rem;
            color: var(--color-petrol);
            margin-bottom: 5px;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--color-text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 20px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--color-accent);
        }

        .config-body {
            padding: 30px;
            flex: 1;
        }

        .config-group {
            margin-bottom: 30px;
        }

        .config-label {
            font-weight: 600;
            margin-bottom: 15px;
            display: block;
            color: var(--color-text-primary);
            font-size: 1.1rem;
        }

        .color-options {
            display: flex;
            gap: 15px;
        }

        .color-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .color-btn:hover {
            transform: scale(1.1);
        }

        .color-btn.active {
            border-color: var(--color-accent);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .color-white { background: #ffffff; border: 1px solid #ddd; }
        .color-black { background: #222222; }
        .color-chrome { background: linear-gradient(135deg, #e0e0e0, #f8f8f8, #c0c0c0); }
        .color-gold { background: linear-gradient(135deg, #d4af37, #f3e5ab, #aa8000); }

        .size-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .size-btn {
            padding: 12px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            text-align: center;
        }

        .size-btn:hover {
            border-color: var(--color-accent);
        }

        .size-btn.active {
            background: rgba(255, 102, 0, 0.1);
            border-color: var(--color-accent);
            color: var(--color-accent);
        }

        .input-group {
            display: flex;
            align-items: center;
            background: #f5f7fa;
            border-radius: 8px;
            padding: 5px 15px;
            border: 1px solid #ddd;
        }

        .input-group input {
            border: none;
            background: transparent;
            padding: 10px;
            font-size: 1rem;
            width: 100%;
            outline: none;
        }

        .config-footer {
            padding: 30px;
            background: #fdfdfd;
            border-top: 1px solid #eaeaea;
        }

        .buy-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            background: var(--color-accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(255, 102, 0, 0.3);
        }

        .buy-btn:hover {
            background: var(--color-accent-hover);
            transform: translateY(-2px);
        }

        #resultado-medida {
            background: #eef2f6;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 0.95rem;
            color: var(--color-text-secondary);
            border-left: 4px solid var(--color-petrol);
        }

        @media (max-width: 900px) {
            .configurator-layout {
                flex-direction: column;
            }
            .config-panel {
                width: 100%;
                height: 50vh;
            }
            .canvas-container {
                height: 50vh;
                flex: none;
            }
        }
    </style>
</head>

<body>

    <div class="configurator-layout">
        <!-- Lado Esquerdo: 3D Canvas -->
        <div class="canvas-container">
            <canvas id="webgl-canvas"></canvas>
            <div class="view-controls">
                <span><iconify-icon icon="mdi:gesture-swipe-horizontal"></iconify-icon> Girar</span>
                <span><iconify-icon icon="mdi:magnify-plus-outline"></iconify-icon> Zoom</span>
            </div>
        </div>

        <!-- Lado Direito: Painel -->
        <div class="config-panel">
            <div class="config-header">
                <a href="index.html" class="back-link">
                    <iconify-icon icon="mdi:arrow-left"></iconify-icon> Voltar para o Início
                </a>
                <h1>Configure seu Varão</h1>
                <p style="font-size: 0.95rem; margin:0;">Visualize em 3D e descubra a medida ideal.</p>
            </div>

            <div class="config-body">
                <!-- Passo 1: Tamanho da Janela -->
                <div class="config-group">
                    <label class="config-label">1. Qual a largura da sua janela?</label>
                    <div class="input-group">
                        <input type="number" id="janela-width" placeholder="Ex: 2.00" step="0.1" min="0.5">
                        <span style="font-weight: 500; color: #666;">Metros</span>
                    </div>
                    <div id="resultado-medida" style="display: none;">
                        Varão Recomendado: <strong id="varao-recomendado">2.40m</strong><br>
                        <small>Deixamos 20cm de sobra de cada lado para melhor acabamento da cortina.</small>
                    </div>
                </div>

                <!-- Passo 2: Diâmetro -->
                <div class="config-group">
                    <label class="config-label">2. Escolha a Espessura</label>
                    <div class="size-options">
                        <button class="size-btn active" data-size="19">Fino (19mm)</button>
                        <button class="size-btn" data-size="28">Grosso (28mm)</button>
                    </div>
                </div>

                <!-- Passo 3: Cor -->
                <div class="config-group">
                    <label class="config-label">3. Escolha a Cor</label>
                    <div class="color-options">
                        <button class="color-btn color-chrome active" data-color="chrome" title="Cromado"></button>
                        <button class="color-btn color-gold" data-color="gold" title="Dourado"></button>
                        <button class="color-btn color-black" data-color="black" title="Preto Fosco"></button>
                        <button class="color-btn color-white" data-color="white" title="Branco"></button>
                    </div>
                </div>
            </div>

            <div class="config-footer">
                <a href="https://shopee.com.br/shop/294248723" target="_blank" class="buy-btn">
                    <iconify-icon icon="mdi:shopping-outline" style="font-size: 1.4rem;"></iconify-icon>
                    Encontrar na Shopee
                </a>
                <p style="text-align: center; font-size: 0.8rem; color: #888; margin-top: 15px;">Você será redirecionado para nossa loja oficial.</p>
            </div>
        </div>
    </div>

    <!-- Import Three.js and OrbitControls -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="configurador.js"></script>

</body>
</html>
